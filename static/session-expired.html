<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessão encerrada | Avant</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0; }
    main { width: min(560px, calc(100% - 40px)); padding: 36px; border: 1px solid rgba(52,211,153,.28); border-radius: 18px; background: linear-gradient(145deg,#07111f,#064e3b); box-shadow: 0 24px 70px rgba(0,0,0,.38); }
    h1 { margin: 0 0 12px; color: #ecfdf5; font-size: 28px; }
    p { color: #cbd5e1; line-height: 1.6; }
    a { display: inline-block; margin-top: 14px; padding: 12px 20px; border-radius: 10px; background: #059669; color: white; text-decoration: none; font-weight: 700; }
    a:hover { background: #10b981; }
  </style>
</head>
<body>
  <main>
    <h1>Sessão encerrada</h1>
    <p>Esta sessão foi encerrada automaticamente após três minutos sem interação para liberar recursos da plataforma Avant.</p>
    <a href="/">Entrar novamente</a>
  </main>
</body>
</html>
